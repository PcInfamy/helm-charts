name: Release Charts

on: push

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      packages: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Add repositories
        run: |
          for dir in $(ls -d charts/*/); do
            helm dependency list $dir 2> /dev/null | tail +2 | head -n -1 | awk '{ print "helm repo add " $1 " " $3 }' | while read cmd; do $cmd; done
          done

      - name: Compute next chart version (librenms)
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "librenms-"
          change_path: "charts/librenms"
          namespace: "librenms"

      - name: Install yq
        if: steps.semver.outputs.changed == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install helm-docs
        if: steps.semver.outputs.changed == 'true'
        run: |
          HELM_DOCS_VERSION=v1.14.2
          curl -sSL https://github.com/norwoodj/helm-docs/releases/download/${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION#v}_Linux_x86_64.tar.gz -o /tmp/helm-docs.tar.gz
          tar -xzf /tmp/helm-docs.tar.gz -C /usr/local/bin helm-docs
          helm-docs --version

      - name: Extract and cut changelog for release
        if: steps.semver.outputs.changed == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          RELEASE_DATE=$(date +%Y-%m-%d)
          
          if [ -f "CHANGELOG.md" ]; then
            echo "Cutting changelog for version $VERSION..."
            
            # Create a temporary file
            TEMP_FILE=$(mktemp)
            
            # Extract the [Unreleased] section content
            UNRELEASED_CONTENT=$(awk '/^## \[Unreleased\]/,/^## \[/' CHANGELOG.md | sed '1d;$d')
            
            # Build new changelog with cut version and reset [Unreleased]
            cat > "$TEMP_FILE" << 'TEMPLATE'
          # Changelog

          All notable changes to the LibreNMS Helm Chart will be documented in this file.

          The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
          and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

          ## [Unreleased]

          ### Added
          - 

          ### Changed
          - 

          ### Deprecated
          - 

          ### Removed
          - 

          ### Fixed
          - 

          ### Security
          - 

          TEMPLATE
            
            # Append the cut version section
            cat >> "$TEMP_FILE" << EOF
          ## [$VERSION] - $RELEASE_DATE

          TEMPLATE
            
            echo "$UNRELEASED_CONTENT" >> "$TEMP_FILE"
            
            # Append the rest of the old changelog (everything after [Unreleased])
            awk '/^## \[Unreleased\]/,/^## \[/{if (/^## \[/ && !/\[Unreleased\]/) {found=1}} found' CHANGELOG.md >> "$TEMP_FILE"
            
            # Extract just the change content for release notes (without the version header)
            echo "$UNRELEASED_CONTENT" > .cr-release-notes.md
            
            # Replace original changelog
            mv "$TEMP_FILE" CHANGELOG.md
            
            # Update Chart.yaml
            yq -i '.version = "'$VERSION'"' charts/librenms/Chart.yaml
            
            # Regenerate chart README from template
            helm-docs -c charts/librenms
            
            # Commit both files
            git add CHANGELOG.md charts/librenms/Chart.yaml charts/librenms/README.md
            git commit -m "chore(release): cut version $VERSION"
            git push
            
            echo "changelog_file=.cr-release-notes.md" >> $GITHUB_OUTPUT
            
            echo "Release notes:"
            cat .cr-release-notes.md
          else
            echo "⚠ CHANGELOG.md not found"
            echo "Release $VERSION" > .cr-release-notes.md
            echo "changelog_file=.cr-release-notes.md" >> $GITHUB_OUTPUT
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_RELEASE_NOTES_FILE: "${{ steps.changelog.outputs.changelog_file }}"

      # see https://github.com/helm/chart-releaser/issues/183
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to GHCR
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*; do
            if [ -z "${pkg:-}" ]; then
              break
            fi
            helm push "${pkg}" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          done